<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAS Diagnostic Tool v2.0</title>
    <style>
        /* --- الألوان الأساسية العميقة والتنسيق العام --- */
        :root {
            --bg-dark: #090d16;        /* لون خلفية داكن وعميق جداً لمنع البهتان */
            --card-bg: #131c2e;        /* لون بطاقات الأعطال (أزرق ليلي داكن) */
            --header-bg: #111827;      /* لون الهيدر الأساسي */
            --input-bg: #0d1321;       /* خلفية مربع البحث */
            --text-main: #f8fafc;      /* النص الأساسي الأبيض الناعم */
            --text-muted: #94a3b8;     /* النص الثانوي */
            --accent-blue: #00b4d8;    /* لون التمييز - أزرق نيون مشع */
            --accent-cyan: #06b6d4;    /* لون ثانوي للقسم والحدود */
            --border-glow: #1e293b;    /* حدود البطاقات الافتراضية */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
            overflow-y: scroll;
        }

        /* --- الهيدر الاحترافي المقسم --- */
        header {
            background-color: var(--header-bg);
            border-bottom: 2px solid var(--accent-blue);
            padding: 15px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1300px;
            margin: 0 auto;
            gap: 30px;
        }

        /* القسم الأيمن: مربع البحث بالكامل */
        .header-right {
            flex: 1;
            max-width: 650px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-box {
            width: 100%;
            padding: 14px 24px;
            background-color: var(--input-bg);
            border: 2px solid var(--border-glow);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .search-box:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.25), inset 0 2px 4px rgba(0,0,0,0.3);
            background-color: #0f172a;
        }

        .search-box::placeholder {
            color: #576574;
        }

        /* القسم الأيسر: اسم الموقع شعار DAS */
        .header-left {
            display: flex;
            align-items: center;
            user-select: none;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-blue);
            text-shadow: 0 0 12px rgba(0, 180, 216, 0.4);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo span {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            border-right: 2px solid #334155;
            padding-right: 12px;
            margin-right: 4px;
        }

        /* --- الحاوية الرئيسية وشريط الإحصائيات --- */
        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .stats-bar {
            margin-bottom: 25px;
            font-size: 15px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #111827;
            padding: 10px 20px;
            border-radius: 8px;
            width: fit-content;
            border: 1px solid #1e293b;
        }

        .stats-counter {
            color: var(--accent-blue);
            font-weight: bold;
        }

        /* --- نظام كروت الأعطال المعزولة والمحسنة --- */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 20px; /* مسافة أمان لعزل كل عطل عن الآخر */
        }

        /* كرت العطل المعزول والأنيق */
        .fault-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .fault-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-blue);
            box-shadow: 0 12px 24px rgba(0, 180, 216, 0.15);
        }

        /* القسم التابع له العطل (يظهر أعلى الكرت بوضوح) */
        .fault-system-badge {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(0, 180, 216, 0.2));
            color: #22d3ee;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(6, 182, 212, 0.3);
            letter-spacing: 0.5px;
        }

        /* تفاصيل الكود والوصف بالداخل */
        .fault-details {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        /* كود العطل البارز */
        .fault-code-tag {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
            min-width: 100px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* وصف العطل المنسق */
        .fault-desc-text {
            font-size: 17px;
            color: #e2e8f0;
            line-height: 1.6;
            font-weight: 500;
            padding-top: 4px;
        }

        /* حالة واجهة البحث الفارغ */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            background-color: var(--card-bg);
            border-radius: 14px;
            color: var(--text-muted);
            border: 2px dashed #1e293b;
        }

        .no-results h3 {
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        /* --- الاستجابة التامة للهواتف الذكية (Responsive Design) --- */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            .header-container {
                flex-direction: column-reverse; /* وضع مربع البحث في الأعلى لتسهيل الوصول بالإبهام */
                gap: 15px;
                align-items: stretch;
            }

            .header-right {
                max-width: 100%;
            }

            .header-left {
                justify-content: center;
            }

            .logo {
                font-size: 24px;
            }

            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .fault-details {
                flex-direction: column; /* تحويل الترتيب لرأسي في الجوال لعدم تداخل النصوص */
                gap: 12px;
            }

            .fault-code-tag {
                align-self: flex-start;
                min-width: auto;
                padding: 6px 14px;
                font-size: 18px;
            }
            
            .fault-desc-text {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-right">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" class="search-box" placeholder="ابحث برقم الكود أو اسم العطل (مثال: F052 أو فرامل)..." autocomplete="off">
                </div>
            </div>
            
            <div class="header-left">
                <div class="logo">
                    DAS <span>Diagnostic Tool</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        
        <div class="stats-bar">
            <span>حالة النظام:</span>
            <span id="statsCounter" class="stats-counter">جاري الفحص...</span>
        </div>

        <div class="results-container" id="resultsContainer"></div>

    </main>

    <script>
        // --- مصفوفة قاعدة البيانات (Client-Side Database) ---
        // يمكنك نسخ ولصق مئات الأعطال هنا وستعمل فوراً وبدون خادم
        const faultDatabase = [
            { system: "ABA – مساعد الفرامل النشط", code: "F015", desc: "خطأ في الاتصال بمستشعر الرادار الأمامي الشاحنة" },
            { system: "ABA – مساعد الفرامل النشط", code: "0110", desc: "جهد الإشارة لمستشعر مسافة الأمان خارج النطاق المسموح" },
            { system: "ART – الرادار والملاحة", code: "F052", desc: "وحدة التحكم ART لا تستجيب لبيانات ناقل الـ CAN" },
            { system: "ART – الرادار والملاحة", code: "1305", desc: "انحراف في معايرة مستشعر الرادار الأفقي الذكي" },
            { system: "BS – نظام الفرامل", code: "0110", desc: "مستشعر سرعة العجلة الأمامية اليمنى - إشارة غير منطقية أو متقطعة" },
            { system: "BS – نظام الفرامل", code: "1305", desc: "صمام التحكم في ضغط التعديل الخلفي الأيسر به دائرة مفتوحة" },
            { system: "BTS – إدارة البطارية", code: "F015", desc: "مستشعر درجة حرارة البطارية يعطي قراءة مرتفعة جداً فوق المعدل" },
            { system: "EDW – نظام الحماية والإنذار", code: "0110", desc: "مفتاح الاتصال الخاص بغطاء المحرك عاطل أو به ماس كهربائي أرضي" }
        ];

        // استهداف عناصر الواجهة من الـ DOM
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const statsCounter = document.getElementById('statsCounter');

        // دالة رندر وبناء كروت الأعطال المعزولة
        function renderFaults(data) {
            resultsContainer.innerHTML = '';

            if (data.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <h3>لم يتم العثور على أي نتائج</h3>
                        <p>تأكد من كتابة الكود بشكل صحيح أو ابحث بكلمات عامة مثل (رادار، مستشعر، ضغط).</p>
                    </div>`;
                statsCounter.innerText = `0 أكواد مطابقة`;
                return;
            }

            // توليد كروت الـ HTML مع الحفاظ على عزل كل عطل
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'fault-card';

                card.innerHTML = `
                    <div class="fault-system-badge">${item.system}</div>
                    <div class="fault-details">
                        <div class="fault-code-tag">${item.code}</div>
                        <div class="fault-desc-text">${item.desc}</div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });

            statsCounter.innerText = `تم العثور على ${data.length} كود عطل`;
        }

        // دالة الفلترة والبحث الفوري الفائقة السرعة
        function handleSearch() {
            const query = searchInput.value.toLowerCase().trim();

            const filtered = faultDatabase.filter(item => {
                return item.code.toLowerCase().includes(query) || 
                       item.desc.toLowerCase().includes(query) ||
                       item.system.toLowerCase().includes(query);
            });

            renderFaults(filtered);
        }

        // تفعيل الاستماع للكتابة الفورية
        searchInput.addEventListener('input', handleSearch);

        // إطلاق التطبيق الأولي عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            renderFaults(faultDatabase);
            searchInput.focus(); // توجيه التركيز للبحث فوراً لتجربة سريعة ومثالية
        });
    </script>
</body>
</html>
